<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Webex — Digital Experiences</title>

  <meta
    name="description"
    content="Webex creates modern, fast and professional websites for modern businesses."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", sans-serif;
      background: #050509;
      color: white;
      overflow-x: hidden;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      position: relative;
      min-height: 100vh;
      width: 100%;
      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =========================
       BACKGROUND
    ========================= */

    .background {
      position: absolute;
      inset: 0;
      z-index: 0;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(141, 92, 255, 0.20),
          transparent 30%
        ),
        radial-gradient(
          circle at 80% 25%,
          rgba(0, 194, 255, 0.16),
          transparent 30%
        ),
        radial-gradient(
          circle at 50% 90%,
          rgba(255, 78, 205, 0.14),
          transparent 32%
        ),
        #050509;
    }

    .grid {
      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(255,255,255,0.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,0.025) 1px,
          transparent 1px
        );

      background-size: 70px 70px;

      mask-image:
        linear-gradient(
          to bottom,
          black,
          transparent 90%
        );
    }

    /* =========================
       3D CANVAS
    ========================= */

    #scene {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 1;

      pointer-events: none;
    }

    /* =========================
       CONTENT
    ========================= */

    .hero-content {
      position: relative;

      z-index: 5;

      width: min(1100px, 92%);

      text-align: center;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding-top: 20px;
    }

    /* =========================
       WEBEX LOGO
    ========================= */

    .logo {
      width: 175px;
      height: auto;

      object-fit: contain;

      margin-bottom: 30px;

      filter:
        drop-shadow(
          0 0 12px rgba(141,92,255,0.65)
        )
        drop-shadow(
          0 0 35px rgba(0,194,255,0.25)
        );

      animation: logoFloat 4s ease-in-out infinite;
    }

    @keyframes logoFloat {

      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-9px);
      }

    }

    /* =========================
       BADGE
    ========================= */

    .badge {

      padding: 9px 18px;

      border:
        1px solid rgba(255,255,255,0.13);

      background:
        rgba(255,255,255,0.055);

      backdrop-filter: blur(18px);

      border-radius: 100px;

      font-size: 11px;

      letter-spacing: 2px;

      text-transform: uppercase;

      color: #d2d2d8;

      margin-bottom: 25px;

      box-shadow:
        0 0 30px rgba(141,92,255,0.08);

      animation:
        fadeUp 1s ease both;
    }

    /* =========================
       MAIN HEADING
    ========================= */

    .hero-title {

      font-size:
        clamp(45px, 8vw, 105px);

      line-height: 0.95;

      font-weight: 800;

      letter-spacing: -5px;

      max-width: 1000px;

      background:
        linear-gradient(
          100deg,
          #ffffff 10%,
          #b99aff 40%,
          #6bdcff 70%,
          #ffffff 90%
        );

      background-size: 200% auto;

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      animation:
        titleReveal 1.2s ease forwards,
        gradientMove 5s linear infinite;
    }

    @keyframes titleReveal {

      from {
        opacity: 0;
        transform: translateY(35px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    @keyframes gradientMove {

      to {
        background-position: 200% center;
      }

    }

    /* =========================
       SUBTITLE
    ========================= */

    .subtitle {

      max-width: 650px;

      margin-top: 30px;

      font-size:
        clamp(16px, 2vw, 20px);

      line-height: 1.7;

      color: #a7a7b0;

      animation:
        fadeUp 1.2s ease 0.2s both;
    }

    @keyframes fadeUp {

      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    /* =========================
       BUTTONS
    ========================= */

    .buttons {

      display: flex;

      gap: 15px;

      margin-top: 40px;

      flex-wrap: wrap;

      justify-content: center;

      animation:
        fadeUp 1.2s ease 0.4s both;
    }

    .btn {

      position: relative;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-width: 175px;

      padding: 16px 25px;

      border-radius: 14px;

      text-decoration: none;

      font-size: 14px;

      font-weight: 700;

      letter-spacing: 0.5px;

      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
    }

    /* PRIMARY */

    .btn-primary {

      color: white;

      background:
        linear-gradient(
          135deg,
          #8d5cff,
          #5b7cff,
          #00c2ff
        );

      box-shadow:
        0 10px 40px
        rgba(91,124,255,0.30);
    }

    .btn-primary:hover {

      transform:
        translateY(-5px)
        scale(1.03);

      box-shadow:
        0 15px 50px
        rgba(91,124,255,0.50);
    }

    /* SECONDARY */

    .btn-secondary {

      color: white;

      border:
        1px solid
        rgba(255,255,255,0.15);

      background:
        rgba(255,255,255,0.06);

      backdrop-filter: blur(15px);
    }

    .btn-secondary:hover {

      transform:
        translateY(-5px);

      background:
        rgba(255,255,255,0.10);

      box-shadow:
        0 10px 35px
        rgba(255,255,255,0.08);
    }

    /* =========================
       TRUST
    ========================= */

    .trust {

      margin-top: 30px;

      font-size: 12px;

      color: #777783;

      letter-spacing: 1px;

      animation:
        fadeUp 1.2s ease 0.6s both;
    }

    .trust span {

      margin: 0 8px;

      color: #8d5cff;
    }

    /* =========================
       SCROLL
    ========================= */

    .scroll {

      position: absolute;

      bottom: 25px;

      left: 50%;

      transform:
        translateX(-50%);

      z-index: 5;

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 8px;

      color: #666673;

      font-size: 10px;

      letter-spacing: 3px;
    }

    .scroll-line {

      width: 1px;

      height: 35px;

      background:
        linear-gradient(
          to bottom,
          transparent,
          #8d5cff
        );

      animation:
        scrollMove 2s infinite;
    }

    @keyframes scrollMove {

      0% {
        opacity: 0;
        transform: translateY(-8px);
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translateY(8px);
      }

    }

    /* =========================
       NEXT SECTION PLACEHOLDER
    ========================= */

    #work {

      min-height: 40vh;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #07070d;

      text-align: center;

      padding: 50px;
    }

    #work h2 {

      font-size:
        clamp(30px, 6vw, 60px);
    }

    #work p {

      color: #777783;

      margin-top: 15px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .hero {
        min-height: 100svh;
      }

      .logo {

        width: 135px;

        margin-bottom: 24px;
      }

      .badge {

        font-size: 8px;

        letter-spacing: 1.2px;

        padding: 8px 13px;
      }

      .hero-title {

        letter-spacing: -2.5px;
      }

      .subtitle {

        font-size: 15px;

        line-height: 1.6;

        max-width: 340px;
      }

      .buttons {

        width: 100%;

        flex-direction: column;

        align-items: center;
      }

      .btn {

        width:
          min(300px, 90%);
      }

      .trust {

        font-size: 9px;
      }

      .scroll {

        bottom: 15px;
      }

    }

  </style>
</head>

<body>

  <!-- =================================
       STEP 1 — WEBEX HERO
  ================================== -->

  <section class="hero">

    <div class="background">
      <div class="grid"></div>
    </div>

    <!-- 3D CANVAS -->
    <canvas id="scene"></canvas>

    <div class="hero-content">

      <!-- YOUR WEBEX LOGO -->
      <img
        src="./logo.png.PNG"

        class="logo"
      >

      <div class="badge">

  <!-- =================================

  ================================== -->

  <section id="work">

    <div>

      <p
        style="
          color:#8d5cff;
          letter-spacing:3px;
          font-size:12px;
        "
      >
        NEXT SECTION
      </p>

      <h2>

      </h2>

      <p>

  <!-- =================================
       THREE.JS
  ================================== -->

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <script>

    /* =========================
       THREE.JS SETUP
    ========================= */

    const canvas =
      document.getElementById("scene");

    const scene =
      new THREE.Scene();

    const camera =
      new THREE.PerspectiveCamera(
        55,
        window.innerWidth /
        window.innerHeight,
        0.1,
        100
      );

    camera.position.z = 7;


    const renderer =
      new THREE.WebGLRenderer({

        canvas: canvas,

        antialias: true,

        alpha: true

      });


    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio,
        2
      )
    );


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );


    /* =========================
       LIGHTS
    ========================= */

    const ambientLight =
      new THREE.AmbientLight(
        0xffffff,
        1
      );

    scene.add(
      ambientLight
    );


    const purpleLight =
      new THREE.PointLight(
        0x8d5cff,
        20,
        20
      );

    purpleLight.position.set(
      2,
      2,
      4
    );

    scene.add(
      purpleLight
    );


    /* =========================
       3D CORE
    ========================= */

    const geometry =
      new THREE.IcosahedronGeometry(
        1.25,
        2
      );


    const material =
      new THREE.MeshPhysicalMaterial({

        color: 0x7b5cff,

        metalness: 0.65,

        roughness: 0.20,

        transmission: 0.15,

        clearcoat: 1,

        clearcoatRoughness: 0.1,

        emissive: 0x301060,

        emissiveIntensity: 0.5

      });


    const core =
      new THREE.Mesh(
        geometry,
        material
      );


    scene.add(core);


    /* =========================
       OUTER RING 1
    ========================= */

    const ringGeometry =
      new THREE.TorusGeometry(
        1.7,
        0.025,
        16,
        100
      );


    const ring1Material =
      new THREE.MeshBasicMaterial({

        color: 0x00c2ff,

        transparent: true,

        opacity: 0.7

      });


    const ring1 =
      new THREE.Mesh(
        ringGeometry,
        ring1Material
      );


    ring1.rotation.x =
      Math.PI / 2.5;


    scene.add(
      ring1
    );


    /* =========================
       OUTER RING 2
    ========================= */

    const ring2Material =
      new THREE.MeshBasicMaterial({

        color: 0xff4ecd,

        transparent: true,

        opacity: 0.55

      });


    const ring2 =
      new THREE.Mesh(
        ringGeometry,
        ring2Material
      );


    ring2.rotation.y =
      Math.PI / 2.5;


    scene.add(
      ring2
    );


    /* =========================
       PARTICLES
    ========================= */

    const particleCount = 900;

    const positions =
      new Float32Array(
        particleCount * 3
      );


    for (
      let i = 0;
      i < particleCount * 3;
      i += 3
    ) {

      positions[i] =
        (Math.random() - 0.5) * 14;

      positions[i + 1] =
        (Math.random() - 0.5) * 10;

      positions[i + 2] =
        (Math.random() - 0.5) * 12;

    }


    const particleGeometry =
      new THREE.BufferGeometry();


    particleGeometry.setAttribute(
      "position",
      new THREE.BufferAttribute(
        positions,
        3
      )
    );


    const particleMaterial =
      new THREE.PointsMaterial({

        color: 0x9f8cff,

        size: 0.025,

        transparent: true,

        opacity: 0.75

      });


    const particles =
      new THREE.Points(
        particleGeometry,
        particleMaterial
      );


    scene.add(
      particles
    );


    /* =========================
       MOUSE
    ========================= */

    let mouseX = 0;

    let mouseY = 0;


    window.addEventListener(
      "mousemove",
      (event) => {

        mouseX =
          (
            event.clientX /
            window.innerWidth -
            0.5
          ) * 2;


        mouseY =
          (
            event.clientY /
            window.innerHeight -
            0.5
          ) * 2;

      }
    );


    /* =========================
       ANIMATION
    ========================= */

    const clock =
      new THREE.Clock();


    function animate() {

      requestAnimationFrame(
        animate
      );


      const time =
        clock.getElapsedTime();


      /* CORE */

      core.rotation.x =
        time * 0.18 +
        mouseY * 0.15;


      core.rotation.y =
        time * 0.25 +
        mouseX * 0.20;


      /* RING 1 */

      ring1.rotation.z =
        time * 0.25;


      ring1.rotation.x =
        Math.PI / 2.5 +
        mouseY * 0.15;


      /* RING 2 */

      ring2.rotation.z =
        -time * 0.18;


      ring2.rotation.y =
        Math.PI / 2.5 +
        mouseX * 0.15;


      /* PARTICLES */

      particles.rotation.y =
        time * 0.015;


      particles.rotation.x =
        mouseY * 0.03;


      /* CAMERA */

      camera.position.x +=
        (
          mouseX * 0.25 -
          camera.position.x
        ) * 0.025;


      camera.position.y +=
        (
          -mouseY * 0.15 -
          camera.position.y
        ) * 0.025;


      camera.lookAt(
        0,
        0,
        0
      );


      renderer.render(
        scene,
        camera
      );

    }


    animate();


    /* =========================
       RESIZE
    ========================= */

    window.addEventListener(
      "resize",
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );

  </script>

</body>
